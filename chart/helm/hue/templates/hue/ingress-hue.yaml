##########################################################################################################
# Qubership custom template. Ingress for Hue, with TLS and custom annotations based on Helm values
##########################################################################################################
{{- if eq (include "hue.ingressEnabled" .) "true" }}
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: hue-ingress
  labels:
    {{- include "allObjectsLabels" . | nindent 4 }}
    {{- tpl (toYaml .Values.ingress.labels) . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.annotations }}
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.tls.enabled }}
  tls:
  - hosts:
    - {{ tpl (toYaml .Values.ingress.domain) . }}
    {{- range .Values.ingress.extraHosts }}
    - {{ . | quote }}
    {{- end }}
    {{- if .Values.ingress.tls.secretName }}
    secretName: {{ .Values.ingress.tls.secretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ tpl (toYaml .Values.ingress.domain) . }}
      http:
        paths:
          - path: /
            pathType: "ImplementationSpecific"
            backend:
              service:
                name: hue
                port:
                  number: 8888
{{- end }}